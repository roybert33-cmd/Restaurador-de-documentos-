<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurador Documental HD</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .canvas-container { 
            background: #e5e7eb; 
            border-radius: 24px; 
            overflow: auto; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 70vh; 
            border: 1px solid #d1d5db;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }
        canvas { 
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            background: white;
        }
        input[type="range"] { accent-color: #000; }
        .custom-loader {
            width: 48px; height: 48px; border: 5px solid #000; border-bottom-color: transparent;
            border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg) } 100% { transform: rotate(360deg) } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        function App() {
            const [img, setImg] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [settings, setSettings] = useState({
                brillo: 100,
                contraste: 110,
                nitidez: 30, // El valor clave para leer mejor
                escala: 100,  // Para agrandar la foto
                modo: 'bn'
            });
            
            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);

            const handleUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsProcessing(true);
                const reader = new FileReader();
                reader.onload = (event) => {
                    const newImg = new Image();
                    newImg.onload = () => {
                        setImg(newImg);
                        setIsProcessing(false);
                    };
                    newImg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const processImage = useCallback(() => {
                if (!img || !canvasRef.current) return;
                
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d', { alpha: false });
                
                // Calculamos el tamaño basado en la escala (Agrandar)
                const factor = settings.escala / 100;
                const targetW = img.width * factor;
                const targetH = img.height * factor;

                // Límite de seguridad para evitar pantalla blanca (max 3000px)
                const limit = 3000;
                const finalScale = Math.min(1, limit / Math.max(targetW, targetH));
                
                canvas.width = targetW * finalScale;
                canvas.height = targetH * finalScale;

                // Dibujar con máxima calidad
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                // Obtener datos de píxeles
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // 1. BRILLO Y CONTRASTE
                const b = (settings.brillo - 100);
                const c = settings.contraste / 100;

                for (let i = 0; i < data.length; i += 4) {
                    for (let j = 0; j < 3; j++) {
                        let p = data[i+j];
                        p = (p + b - 128) * c + 128;
                        data[i+j] = p;
                    }

                    // MODO LECTURA (B/N de alto contraste)
                    if (settings.modo === 'bn') {
                        const gray = data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
                        const threshold = gray > 128 ? 255 : 0; // Umbral simple para texto limpio
                        // Mezcla suave entre gris y b/n para legibilidad
                        const final = (gray * 0.3) + (threshold * 0.7);
                        data[i] = data[i+1] = data[i+2] = final;
                    }
                }

                // 2. FILTRO DE NITIDEZ (Matrix Convolution)
                // Esto hace que los bordes de las letras se vean definidos
                if (settings.nitidez > 0) {
                    const amount = settings.nitidez / 100;
                    const weights = [ 0, -amount, 0, -amount, 1 + (amount * 4), -amount, 0, -amount, 0 ];
                    const side = Math.round(Math.sqrt(weights.length));
                    const halfSide = Math.floor(side / 2);
                    const sw = canvas.width;
                    const sh = canvas.height;
                    const output = ctx.createImageData(sw, sh);
                    const dst = output.data;

                    for (let y = 0; y < sh; y++) {
                        for (let x = 0; x < sw; x++) {
                            const sy = y;
                            const sx = x;
                            const dstOff = (y * sw + x) * 4;
                            let r = 0, g = 0, b = 0;
                            for (let cy = 0; cy < side; cy++) {
                                for (let cx = 0; cx < side; cx++) {
                                    const scy = sy + cy - halfSide;
                                    const scx = sx + cx - halfSide;
                                    if (scy >= 0 && scy < sh && scx >= 0 && scx < sw) {
                                        const srcOff = (scy * sw + scx) * 4;
                                        const wt = weights[cy * side + cx];
                                        r += data[srcOff] * wt;
                                        g += data[srcOff + 1] * wt;
                                        b += data[srcOff + 2] * wt;
                                    }
                                }
                            }
                            dst[dstOff] = r; dst[dstOff+1] = g; dst[dstOff+2] = b; dst[dstOff+3] = 255;
                        }
                    }
                    ctx.putImageData(output, 0, 0);
                } else {
                    ctx.putImageData(imageData, 0, 0);
                }
            }, [img, settings]);

            useEffect(() => {
                const timer = setTimeout(processImage, 300);
                return () => clearTimeout(timer);
            }, [processImage]);

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white border-b px-8 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="bg-black text-white w-8 h-8 rounded flex items-center justify-center font-bold">HD</div>
                            <h1 className="font-bold text-xl tracking-tight">Restaurador Pro <span className="text-blue-600">Ultra nitidez</span></h1>
                        </div>
                        {img && <button onClick={() => setImg(null)} className="text-red-500 font-semibold text-sm">Cargar nueva imagen</button>}
                    </header>

                    <main className="flex-1 p-6 grid lg:grid-cols-[350px_1fr] gap-8">
                        {!img ? (
                            <div className="col-span-2 flex flex-col items-center justify-center mt-20">
                                <div 
                                    className="w-full max-w-2xl p-20 border-4 border-dashed border-neutral-300 rounded-[40px] bg-white text-center hover:border-black transition-all cursor-pointer"
                                    onClick={() => fileInputRef.current.click()}
                                >
                                    <p className="text-2xl font-bold mb-2">Sube el documento para mejorar píxeles</p>
                                    <p className="text-neutral-400 mb-8">Especial para recibos, carnets y fotos borrosas</p>
                                    <button className="bg-black text-white px-10 py-4 rounded-full font-bold">Seleccionar archivo</button>
                                </div>
                                <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={handleUpload} />
                            </div>
                        ) : (
                            <>
                                {/* Panel de Control */}
                                <aside className="bg-white rounded-[32px] p-8 border shadow-sm space-y-8 h-fit">
                                    <div>
                                        <label className="text-[11px] font-bold uppercase text-neutral-400 block mb-4 tracking-widest">Mejora de Píxeles</label>
                                        <div className="space-y-6">
                                            <div>
                                                <div className="flex justify-between text-sm font-bold mb-2"><span>Nitidez (Enfoque)</span><span>{settings.nitidez}%</span></div>
                                                <input type="range" min="0" max="100" value={settings.nitidez} onChange={e => setSettings({...settings, nitidez: parseInt(e.target.value)})} className="w-full" />
                                                <p className="text-[10px] text-neutral-400 mt-1">Aumenta para leer letras borrosas.</p>
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-sm font-bold mb-2"><span>Agrandar (Escala)</span><span>{settings.escala}%</span></div>
                                                <input type="range" min="100" max="250" value={settings.escala} onChange={e => setSettings({...settings, escala: parseInt(e.target.value)})} className="w-full" />
                                                <p className="text-[10px] text-neutral-400 mt-1">Aumenta el tamaño de la imagen original.</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <label className="text-[11px] font-bold uppercase text-neutral-400 block tracking-widest">Ajustes de Luz</label>
                                        <div>
                                            <div className="flex justify-between text-sm font-bold mb-2"><span>Contraste</span><span>{settings.contraste}%</span></div>
                                            <input type="range" min="50" max="200" value={settings.contraste} onChange={e => setSettings({...settings, contraste: parseInt(e.target.value)})} className="w-full" />
                                        </div>
                                        <div>
                                            <div className="flex justify-between text-sm font-bold mb-2"><span>Brillo</span><span>{settings.brillo}%</span></div>
                                            <input type="range" min="50" max="150" value={settings.brillo} onChange={e => setSettings({...settings, brillo: parseInt(e.target.value)})} className="w-full" />
                                        </div>
                                    </div>

                                    <button 
                                        onClick={() => {
                                            const link = document.createElement('a');
                                            link.download = 'documento_hd.jpg';
                                            link.href = canvasRef.current.toDataURL('image/jpeg', 1.0);
                                            link.click();
                                        }}
                                        className="w-full bg-black text-white py-4 rounded-2xl font-bold shadow-xl hover:scale-[1.02] transition active:scale-95 flex items-center justify-center gap-2"
                                    >
                                        Descargar en HD
                                    </button>
                                </aside>

                                {/* Área de Visualización */}
                                <div className="flex flex-col gap-4">
                                    <div className="canvas-container">
                                        {isProcessing && <div className="absolute z-20 flex flex-col items-center gap-4"><span className="custom-loader"></span><p className="font-bold">Reconstruyendo píxeles...</p></div>}
                                        <canvas ref={canvasRef} />
                                    </div>
                                    <div className="bg-blue-50 border border-blue-100 p-4 rounded-2xl text-blue-800 text-xs leading-relaxed">
                                        <strong>Tip de lectura:</strong> Si el texto es muy pequeño, sube la <b>Escala</b> al 200% y luego ajusta la <b>Nitidez</b> hasta que las letras negras se vean bien definidas sobre el fondo blanco.
                                    </div>
                                </div>
                            </>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

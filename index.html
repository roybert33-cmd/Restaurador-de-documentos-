<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurador Pro v2</title>
    
    <!-- Librerías de alta compatibilidad -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fbfbfa; }
        .drop-zone { transition: all 0.3s ease; border: 2px dashed #e5e7eb; }
        .drop-zone:hover { border-color: #000; background-color: #f9fafb; }
        .canvas-box { background: #f3f4f6; border-radius: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 400px; position: relative; }
        canvas { max-width: 100%; max-height: 65vh; height: auto; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .loader { width: 24px; height: 24px; border: 3px solid #FFF; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        function App() {
            const [image, setImage] = useState(null);
            const [loading, setLoading] = useState(false);
            const [settings, setSettings] = useState({ brillo: 100, contraste: 100, nitidez: 0, modo: 'auto' });
            const [rotation, setRotation] = useState(0);
            
            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);

            // Cargar imagen
            const onFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setLoading(true);
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            setImage(img);
                            setLoading(false);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Procesar imagen en el Canvas
            const applyFilters = useCallback(() => {
                if (!image || !canvasRef.current) return;
                
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                
                const isRotated = rotation === 90 || rotation === 270;
                const width = isRotated ? image.height : image.width;
                const height = isRotated ? image.width : image.height;

                // Escalar si es muy grande para evitar que se ponga blanco
                const MAX_SIZE = 1600;
                let scale = 1;
                if (Math.max(width, height) > MAX_SIZE) {
                    scale = MAX_SIZE / Math.max(width, height);
                }

                canvas.width = width * scale;
                canvas.height = height * scale;

                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate((rotation * Math.PI) / 180);
                const drawW = isRotated ? canvas.height : canvas.width;
                const drawH = isRotated ? canvas.width : canvas.height;
                ctx.drawImage(image, -drawW / 2, -drawH / 2, drawW, drawH);
                ctx.restore();

                // Filtros de píxeles
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                const b = (settings.brillo - 100) * 1.2;
                const c = settings.contraste / 100;

                for (let i = 0; i < data.length; i += 4) {
                    // Brillo y Contraste
                    for (let j = 0; j < 3; j++) {
                        data[i + j] = (data[i + j] + b - 128) * c + 128;
                    }
                    // Modo Blanco y Negro (Gris optimizado)
                    if (settings.modo === 'auto') {
                        const gray = data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11;
                        data[i] = data[i + 1] = data[i + 2] = gray;
                    }
                }
                ctx.putImageData(imageData, 0, 0);
            }, [image, settings, rotation]);

            useEffect(() => {
                applyFilters();
            }, [applyFilters]);

            const downloadImage = () => {
                const link = document.createElement('a');
                link.download = 'documento_mejorado.jpg';
                link.href = canvasRef.current.toDataURL('image/jpeg', 0.9);
                link.click();
            };

            return (
                <div className="min-h-screen">
                    {/* Barra superior */}
                    <nav className="bg-white border-b px-8 py-4 flex justify-between items-center sticky top-0 z-50">
                        <div className="flex items-center gap-2">
                            <div className="bg-black text-white p-2 rounded-lg font-black italic">R</div>
                            <span className="font-bold tracking-tight text-lg">Restaurador Pro</span>
                        </div>
                        {image && (
                            <button 
                                onClick={() => setImage(null)}
                                className="text-sm font-semibold text-red-500 hover:bg-red-50 px-4 py-2 rounded-full"
                            >
                                Cambiar foto
                            </button>
                        )}
                    </nav>

                    <main className="max-w-6xl mx-auto p-6">
                        {!image ? (
                            /* Pantalla de subida */
                            <div className="mt-20 text-center">
                                <h1 className="text-5xl font-extrabold mb-4 tracking-tighter text-neutral-900">
                                    Mejora tus documentos <br/> con nitidez profesional.
                                </h1>
                                <p className="text-neutral-500 text-lg mb-12">No enviamos tus fotos a ningún servidor. Privacidad 100%.</p>
                                
                                <div 
                                    className="drop-zone bg-white rounded-[40px] p-20 cursor-pointer shadow-xl"
                                    onClick={() => fileInputRef.current.click()}
                                >
                                    <div className="bg-neutral-100 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6">
                                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    </div>
                                    <p className="text-2xl font-bold mb-2">Haz clic para subir una foto</p>
                                    <p className="text-neutral-400">JPG, PNG o PDF (como imagen)</p>
                                    <input 
                                        type="file" 
                                        ref={fileInputRef} 
                                        className="hidden" 
                                        accept="image/*" 
                                        onChange={onFileChange}
                                    />
                                </div>
                            </div>
                        ) : (
                            /* Pantalla de Edición */
                            <div className="grid lg:grid-cols-[320px_1fr] gap-8 mt-4 animate-in slide-in-from-bottom-4 duration-500">
                                {/* Barra lateral de controles */}
                                <div className="space-y-6">
                                    <div className="bg-white border rounded-[32px] p-6 shadow-sm space-y-8">
                                        <div>
                                            <label className="text-[10px] font-bold uppercase tracking-widest text-neutral-400 block mb-4">Modo</label>
                                            <div className="flex bg-neutral-100 p-1 rounded-2xl">
                                                <button 
                                                    onClick={() => setSettings({...settings, modo: 'color'})}
                                                    className={`flex-1 py-2 rounded-xl text-sm font-bold transition ${settings.modo === 'color' ? 'bg-white shadow-sm' : 'text-neutral-500'}`}
                                                >Color</button>
                                                <button 
                                                    onClick={() => setSettings({...settings, modo: 'auto'})}
                                                    className={`flex-1 py-2 rounded-xl text-sm font-bold transition ${settings.modo === 'auto' ? 'bg-white shadow-sm' : 'text-neutral-500'}`}
                                                >B/N</button>
                                            </div>
                                        </div>

                                        <div className="space-y-6">
                                            <div>
                                                <div className="flex justify-between text-sm font-bold mb-3"><span>Brillo</span><span>{settings.brillo}%</span></div>
                                                <input type="range" min="0" max="200" value={settings.brillo} onChange={(e) => setSettings({...settings, brillo: e.target.value})} className="w-full accent-black"/>
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-sm font-bold mb-3"><span>Contraste</span><span>{settings.contraste}%</span></div>
                                                <input type="range" min="0" max="200" value={settings.contraste} onChange={(e) => setSettings({...settings, contraste: e.target.value})} className="w-full accent-black"/>
                                            </div>
                                        </div>

                                        <div className="pt-4 space-y-3">
                                            <button 
                                                onClick={() => setRotation((rotation + 90) % 360)}
                                                className="w-full border-2 border-neutral-100 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-neutral-50 transition"
                                            >
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                                                Rotar imagen
                                            </button>
                                            <button 
                                                onClick={downloadImage}
                                                className="w-full bg-black text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 hover:opacity-90 shadow-xl transition active:scale-95"
                                            >
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                                Descargar JPG
                                            </button>
                                        </div>
                                    </div>
                                    <p className="text-[10px] text-center text-neutral-400 font-medium">Procesamiento local: La imagen nunca sale de tu PC.</p>
                                </div>

                                {/* Previsualización */}
                                <div className="canvas-box border-2 border-white shadow-2xl">
                                    {loading && <div className="absolute inset-0 flex items-center justify-center bg-white/50 z-10"><span className="loader"></span></div>}
                                    <canvas ref={canvasRef}></canvas>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurador Profesional V4</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f0f0f7; font-family: sans-serif; }
        canvas { max-width: 100%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); background: white; }
        .slider-label { font-size: 11px; font-weight: 800; color: #666; text-transform: uppercase; margin-bottom: 4px; display: block; }
        input[type="range"] { accent-color: #007aff; width: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [img, setImg] = useState(null);
            const [params, setParams] = useState({ brillo: 100, contraste: 100, nitidez: 15, limpieza: 0, saturacion: 100 });
            const canvasRef = useRef(null);

            const handleFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const i = new Image();
                    i.onload = () => setImg(i);
                    i.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };

            // Función especial para TU acta
            const autoRestore = () => {
                setParams({
                    brillo: 115,
                    contraste: 155,
                    nitidez: 35,
                    limpieza: 65,
                    saturacion: 140
                });
            };

            useEffect(() => {
                if (!img || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                const idata = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = idata.data;
                const { brillo, contraste, limpieza, saturacion } = params;
                const b = brillo - 100;
                const c = contraste / 100;
                const sat = saturacion / 100;

                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i+1], bl = data[i+2];

                    // Brillo y Contraste
                    r = (r + b - 128) * c + 128;
                    g = (g + b - 128) * c + 128;
                    bl = (bl + b - 128) * c + 128;

                    // Saturación (Para el sello verde)
                    const gray = 0.299*r + 0.587*g + 0.114*bl;
                    r = gray + (r - gray) * sat;
                    g = gray + (g - gray) * sat;
                    bl = gray + (bl - gray) * sat;

                    // Limpieza de fondo (Blanqueado)
                    if (gray > (255 - limpieza)) {
                        r = g = bl = 255;
                    }

                    data[i] = r; data[i+1] = g; data[i+2] = bl;
                }
                ctx.putImageData(idata, 0, 0);
            }, [img, params]);

            return (
                <div className="max-w-xl mx-auto p-4">
                    <header className="text-center py-6">
                        <h1 className="text-2xl font-black italic">RESTAURADOR PRO V4</h1>
                    </header>

                    {!img ? (
                        <div className="bg-white p-12 border-4 border-dashed rounded-3xl text-center" onClick={() => document.getElementById('f').click()}>
                            <p className="font-bold text-gray-400">Toca para cargar tu acta</p>
                            <input type="file" id="f" hidden accept="image/*" onChange={handleFile} />
                        </div>
                    ) : (
                        <div className="space-y-4">
                            <div className="flex justify-center bg-gray-200 p-2 rounded-xl overflow-auto h-80">
                                <canvas ref={canvasRef} />
                            </div>

                            <button onClick={autoRestore} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg shadow-xl animate-pulse">
                                ✨ MAGIA: AUTO-RESTAURAR ACTA
                            </button>

                            <div className="bg-white p-6 rounded-3xl shadow-lg grid grid-cols-2 gap-4">
                                <div>
                                    <span className="slider-label">Nitidez</span>
                                    <input type="range" min="0" max="100" value={params.nitidez} onChange={e => setParams({...params, nitidez: parseInt(e.target.value)})} />
                                </div>
                                <div>
                                    <span className="slider-label">Blanquear Fondo</span>
                                    <input type="range" min="0" max="150" value={params.limpieza} onChange={e => setParams({...params, limpieza: parseInt(e.target.value)})} />
                                </div>
                                <div>
                                    <span className="slider-label">Color Sello</span>
                                    <input type="range" min="0" max="200" value={params.saturacion} onChange={e => setParams({...params, saturacion: parseInt(e.target.value)})} />
                                </div>
                                <button onClick={() => {
                                    const a = document.createElement('a');
                                    a.download = 'acta_perfecta.jpg';
                                    a.href = canvasRef.current.toDataURL('image/jpeg', 0.95);
                                    a.click();
                                }} className="bg-black text-white rounded-xl font-bold text-xs uppercase">Guardar HD</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

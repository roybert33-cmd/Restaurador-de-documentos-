<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Restaurador de Actas Pro</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: sans-serif; background-color: #efeff4; color: #1c1c1e; }
        .canvas-area { 
            background: #d1d1d6; border-radius: 20px; overflow: auto; 
            display: flex; align-items: flex-start; justify-content: center; 
            height: 55vh; border: 1px solid #c6c6c8; margin-bottom: 15px;
        }
        canvas { box-shadow: 0 8px 30px rgba(0,0,0,0.15); background: white; margin: 15px; }
        input[type="range"] { accent-color: #007aff; width: 100%; height: 5px; }
        .btn-primary { background: #007aff; color: white; font-weight: bold; padding: 14px; border-radius: 12px; width: 100%; }
        .control-card { background: white; border-radius: 20px; padding: 20px; shadow: 0 4px 12px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        function App() {
            const [img, setImg] = useState(null);
            const [settings, setSettings] = useState({
                limpieza: 40,  // Elimina el gris del papel
                tinta: 50,     // Resalta las letras
                zoom: 100,
                nitidez: 10
            });
            
            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);

            const handleUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const newImg = new Image();
                    newImg.onload = () => setImg(newImg);
                    newImg.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };

            const process = useCallback(() => {
                if (!img || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                
                const factor = settings.zoom / 100;
                canvas.width = img.width * factor;
                canvas.height = img.height * factor;

                // Limite de seguridad para móviles
                if(canvas.width > 2500) {
                    const scale = 2500 / canvas.width;
                    canvas.width *= scale;
                    canvas.height *= scale;
                }

                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // Algoritmo de Limpieza Documental
                const l = settings.limpieza; // Nivel de blanco
                const t = settings.tinta / 100; // Multiplicador de negro

                for (let i = 0; i < data.length; i += 4) {
                    // 1. Convertir a escala de grises realzada
                    let gray = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;

                    // 2. Blanquear fondo (Curva Gamma local)
                    // Si el pixel es claro (papel), lo forzamos a blanco
                    if (gray > (255 - l)) {
                        gray = 255;
                    } else {
                        // Si es oscuro (tinta), lo oscurecemos más
                        gray = Math.max(0, gray * (1 - t));
                    }

                    data[i] = data[i+1] = data[i+2] = gray;
                }

                ctx.putImageData(imageData, 0, 0);
            }, [img, settings]);

            useEffect(() => {
                const timer = setTimeout(process, 200);
                return () => clearTimeout(timer);
            }, [process]);

            return (
                <div className="max-w-md mx-auto p-4">
                    <header className="mb-6 text-center">
                        <h1 className="text-2xl font-bold tracking-tight">Restaurador de Actas</h1>
                        <p className="text-gray-500 text-sm">Optimizado para lectura de registros</p>
                    </header>

                    {!img ? (
                        <div 
                            className="bg-white border-2 border-dashed border-gray-300 rounded-[30px] p-12 text-center"
                            onClick={() => fileInputRef.current.click()}
                        >
                            <div className="text-4xl mb-4">📄</div>
                            <p className="font-bold">Subir foto del acta</p>
                            <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={handleUpload} />
                        </div>
                    ) : (
                        <div className="animate-in fade-in">
                            <div className="canvas-area">
                                <canvas ref={canvasRef} />
                            </div>

                            <div className="control-card space-y-6">
                                <div>
                                    <div className="flex justify-between text-xs font-bold mb-2 uppercase">
                                        <span>Limpiar Papel (Fondo)</span>
                                        <span className="text-blue-600">{settings.limpieza}</span>
                                    </div>
                                    <input type="range" min="0" max="150" value={settings.limpieza} 
                                        onChange={e => setSettings({...settings, limpieza: parseInt(e.target.value)})} />
                                </div>

                                <div>
                                    <div className="flex justify-between text-xs font-bold mb-2 uppercase">
                                        <span>Resaltar Tinta (Letras)</span>
                                        <span className="text-blue-600">{settings.tinta}</span>
                                    </div>
                                    <input type="range" min="0" max="100" value={settings.tinta} 
                                        onChange={e => setSettings({...settings, tinta: parseInt(e.target.value)})} />
                                </div>

                                <div className="flex gap-4">
                                    <button onClick={() => setImg(null)} className="flex-1 py-3 border border-gray-300 rounded-xl font-bold text-sm">Atrás</button>
                                    <button 
                                        onClick={() => {
                                            const link = document.createElement('a');
                                            link.download = 'acta_limpia.jpg';
                                            link.href = canvasRef.current.toDataURL('image/jpeg', 0.95);
                                            link.click();
                                        }}
                                        className="flex-[2] bg-black text-white py-3 rounded-xl font-bold text-sm"
                                    >Descargar Acta</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
